name: AWS Deploy

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy site and Lambda
    runs-on: ubuntu-latest

    permissions:
      id-token: write # OIDC token to assume the AWS deploy role
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.DEPLOY_ROLE_ARN }}
          aws-region: us-east-2

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build Lambda
        run: npm run build

      - name: Compress Lambda files
        run: |
          cd lambda/dist
          zip -r ../../lambdadeploy.zip .

      - name: Sync frontend to S3
        env:
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
        run: aws s3 sync site/ "s3://$S3_BUCKET" --delete

      - name: Create CloudFront invalidation
        env:
          DISTRIBUTION_ID: ${{ secrets.AWS_CLOUDFRONT_DISTRIBUTION_ID }}
        run: aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" --paths "/*"

      - name: Deploy Lambda
        env:
          FUNCTION_NAME: ${{ secrets.AWS_LAMBDA_FUNCTION }}
        run: aws lambda update-function-code --function-name "$FUNCTION_NAME" --zip-file fileb://lambdadeploy.zip
